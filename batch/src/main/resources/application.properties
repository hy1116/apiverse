spring.application.name=apiverse-batch
spring.main.web-application-type=none

# 로그 파일 (override via env: LOG_PATH)
logging.file.name=${LOG_PATH:./logs}/batch.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# JDBC PostgreSQL — 다른 모듈의 DB_URL은 r2dbc:// 형식이라 별도 변수를 쓴다 (override via env: DB_JDBC_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/apiverse}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# 업무 테이블 스키마는 gateway(schema.sql) 소유 — 여기서는 실행하지 않음
spring.sql.init.mode=never

# Spring Batch 메타 테이블(BATCH_*) 자동 생성. 스크립트에 IF NOT EXISTS가 없어 두 번째 실행부터는 CREATE 오류를 무시한다.
spring.batch.jdbc.initialize-schema=always
spring.batch.jdbc.continue-on-error=true

# Job 실행은 BatchJobRunner가 담당 (기본값 계산, 종료 코드)
spring.batch.job.enabled=false

app.batch.zone=Asia/Seoul
app.batch.settlement.chunk-size=500
